<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <defs>
    <linearGradient id="cloudSnowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="snowGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Logo Mark: Cloud + Snowflake Intertwined -->
  <g transform="translate(6, 6)" filter="url(#softGlow)">
    <!-- Base Cloud Shape -->
    <path d="M16 38 C10 38 5 33 5 27 C5 21.8 8.8 17.5 13.8 16.3 C15.4 9.6 21.6 4.5 29 4.5 C38.1 4.5 45.5 11.9 45.5 21 C45.5 21.5 45.4 22 45.4 22.5 C48 23.8 49.5 26.5 49.5 29.5 C49.5 34.2 45.7 38 41 38 Z" 
          fill="url(#cloudSnowGrad)" opacity="0.95"/>
    
    <!-- Stylized Geometric Snowflake Overlay -->
    <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(27, 24)">
      <!-- Main axes -->
      <line x1="0" y1="-12" x2="0" y2="12" />
      <line x1="-10.4" y1="-6" x2="10.4" y2="6" />
      <line x1="-10.4" y1="6" x2="10.4" y2="-6" />
      
      <!-- Snowflake crystalline branches -->
      <!-- Top -->
      <line x1="0" y1="-8" x2="-3.5" y2="-10.5" />
      <line x1="0" y1="-8" x2="3.5" y2="-10.5" />
      <!-- Bottom -->
      <line x1="0" y1="8" x2="-3.5" y2="10.5" />
      <line x1="0" y1="8" x2="3.5" y2="10.5" />
      <!-- Upper Right -->
      <line x1="6.9" y1="-4" x2="9.5" y2="-7" />
      <line x1="6.9" y1="-4" x2="6.9" y2="-0.5" />
      <!-- Lower Left -->
      <line x1="-6.9" y1="4" x2="-9.5" y2="7" />
      <line x1="-6.9" y1="4" x2="-6.9" y2="0.5" />
      <!-- Upper Left -->
      <line x1="-6.9" y1="-4" x2="-9.5" y2="-7" />
      <line x1="-6.9" y1="-4" x2="-6.9" y2="-0.5" />
      <!-- Lower Right -->
      <line x1="6.9" y1="4" x2="9.5" y2="7" />
      <line x1="6.9" y1="4" x2="6.9" y2="0.5" />

      <!-- Center Sparkle -->
      <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" stroke="none" />
    </g>
  </g>

  <!-- Brand Typography -->
  <!-- Main Name: 吹雪云 -->
  <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-weight="700" font-size="22" fill="#0F172A" letter-spacing="1.5">
    吹雪云
  </text>
  
  <!-- Subtle Tag / Subtitle: CHUIXUE CLOUD & Japanese Kanji Accent -->
  <text x="69" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#0284C7" letter-spacing="2.2">
    CHUIXUE CLOUD
  </text>
  <text x="172" y="47" font-family="'Yu Gothic', 'Hiragino Kaku Gothic Pro', sans-serif" font-weight="400" font-size="8.5" fill="#94A3B8" letter-spacing="1">
    · ふぶき
  </text>
</svg>
